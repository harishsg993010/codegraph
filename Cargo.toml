[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
tree-sitter = "0.27"
anyhow = "1"
rayon = "1.11"
blake3 = "1"
memmap2 = "0.9"
zerocopy = { version = "0.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
codegraph-core = { path = "crates/codegraph-core" }
codegraph-store = { path = "crates/codegraph-store" }
codegraph-index = { path = "crates/codegraph-index" }
codegraph-query = { path = "crates/codegraph-query" }
codegraph-extract = { path = "crates/codegraph-extract" }
codegraph-resolve = { path = "crates/codegraph-resolve" }
codegraph-security = { path = "crates/codegraph-security" }
codegraph-cli = { path = "crates/codegraph-cli" }
codegraph-server = { path = "crates/codegraph-server" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
