      - pattern: query
      - pattern: params
      - pattern: body
      - pattern: form
      - pattern: path
    pattern-sinks:
      - pattern: reqwest::get
      - pattern: reqwest::blocking::get
      - pattern: Client::get
      - pattern: Client::post
      - pattern: Client::put
      - pattern: Client::delete
      - pattern: Client::request
      - pattern: Client::head
      - pattern: ureq::get
      - pattern: ureq::post
      - pattern: ureq::request
      - pattern: Agent::get
      - pattern: Agent::post
      - pattern: hyper::Uri
      - pattern: Uri::from_str
      - pattern: Url::parse
      - pattern: TcpStream::connect
      - pattern: tokio::net::TcpStream::connect
      - pattern: lookup_host
      - pattern: ToSocketAddrs::to_socket_addrs
      - pattern: isahc::get
      - pattern: surf::get
      - pattern: awc::Client::get

