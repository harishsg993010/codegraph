# codegraph rules — Rust. Apache-2.0.
#
# Web handlers receive extractors (`req`, `request`, `path`, `query`,
# `body`, `form`, `params`); those parameters and the process-level
# inputs are the sources. `a::b::c` patterns split like `a.b.c`.

rules:
  - id: rust.command-injection
    message: External input reaches a process spawn
    severity: ERROR
    languages: [rust]
    metadata: { cwe: CWE-78, owasp: "A03:2021" }
    pattern-sources:
      - pattern: req
      - pattern: request
      - pattern: "*request*"
      - pattern: query
      - pattern: params
      - pattern: body
      - pattern: form
      - pattern: path
      - pattern: std::env::args
      - pattern: env::args
      - pattern: std::env::var
      - pattern: env::var
      - pattern: stdin
      - pattern: read_line
    pattern-sinks:
      - pattern: Command::new
      - pattern: Command::arg
      - pattern: Command::args
      - pattern: process::Command
      - pattern: tokio::process::Command
      - pattern: async_process::Command
      - pattern: std::process::Command
    pattern-sanitizers:
      - pattern: shell_escape::escape
      - pattern: shlex::quote
      - pattern: shlex::try_quote
      - pattern: shell_words::quote

  - id: rust.sql-injection
    message: External input reaches a SQL query built from it
    severity: ERROR
    languages: [rust]
    metadata: { cwe: CWE-89, owasp: "A03:2021" }
    pattern-sources:
      - pattern: req
      - pattern: request
      - pattern: "*request*"
      - pattern: query
      - pattern: params
      - pattern: body
      - pattern: form
      - pattern: path
    pattern-sinks:
      - pattern: sqlx::query
      - pattern: sqlx::query_as
      - pattern: sqlx::query_scalar
      - pattern: sqlx::raw_sql
      - pattern: raw_sql
      - pattern: diesel::sql_query
      - pattern: sql_query
      - pattern: diesel::dsl::sql
      - pattern: sql
      - pattern: Connection::execute
      - pattern: Connection::execute_batch
      - pattern: Connection::prepare
      - pattern: Connection::query
      - pattern: Connection::query_row
      - pattern: Client::query
      - pattern: Client::execute
      - pattern: Client::batch_execute
      - pattern: Client::prepare
      - pattern: Transaction::execute
      - pattern: Transaction::query
      - pattern: Conn::query_drop
      - pattern: Conn::exec_drop
      - pattern: Conn::query_iter
      - pattern: Statement::from_string
      - pattern: Statement::from_sql_and_values
    pattern-sanitizers:
      - pattern: str::parse
      - pattern: parse
      - pattern: escape_literal
      - pattern: escape_identifier

  - id: rust.path-traversal
    message: External input reaches a file operation
    severity: WARNING
    languages: [rust]
    metadata: { cwe: CWE-22, owasp: "A01:2021" }
    pattern-sources:
      - pattern: req
      - pattern: request
      - pattern: "*request*"
      - pattern: query
      - pattern: params
      - pattern: body
      - pattern: form
      - pattern: path
      - pattern: filename
      - pattern: file_name
    pattern-sinks:
      - pattern: File::open
      - pattern: File::create
      - pattern: File::create_new
      - pattern: OpenOptions::open
      - pattern: fs::read
      - pattern: fs::read_to_string
      - pattern: fs::write
      - pattern: fs::remove_file
      - pattern: fs::remove_dir
      - pattern: fs::remove_dir_all
      - pattern: fs::rename
      - pattern: fs::copy
      - pattern: fs::create_dir
      - pattern: fs::create_dir_all
      - pattern: fs::read_dir
      - pattern: fs::metadata
      - pattern: fs::symlink_metadata
      - pattern: fs::hard_link
      - pattern: fs::set_permissions
      - pattern: std::fs::read
      - pattern: std::fs::write
      - pattern: tokio::fs::read
      - pattern: tokio::fs::write
      - pattern: tokio::fs::File::open
      - pattern: tokio::fs::remove_file
      - pattern: NamedFile::open
      - pattern: ServeFile::new
      - pattern: ServeDir::new
      - pattern: Path::new
      - pattern: PathBuf::from
      - pattern: PathBuf::push
      - pattern: Path::join
      - pattern: ZipArchive::extract
      - pattern: Archive::unpack
    pattern-sanitizers:
      - pattern: Path::file_name
      - pattern: file_name
      - pattern: fs::canonicalize
      - pattern: canonicalize
      - pattern: Path::canonicalize
      - pattern: path_clean::clean
      - pattern: clean
      - pattern: Path::strip_prefix
      - pattern: sanitize_filename::sanitize
      - pattern: "*sanitize*"

