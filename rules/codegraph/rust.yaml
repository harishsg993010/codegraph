  - id: rust.weak-random-for-secrets
    message: A non-cryptographic RNG reaches a key, token or nonce
    severity: WARNING
    languages: [rust]
    metadata: { cwe: CWE-338, owasp: "A02:2021" }
    pattern-sources:
      - pattern: rand::thread_rng
      - pattern: thread_rng
      - pattern: rand::random
      - pattern: random
      - pattern: SmallRng::from_entropy
      - pattern: SmallRng::seed_from_u64
      - pattern: StdRng::seed_from_u64
      - pattern: fastrand::u64
      - pattern: fastrand::u32
      - pattern: fastrand::bytes
      - pattern: oorandom::Rand64
      - pattern: XorShiftRng
      - pattern: Pcg64
    pattern-sinks:
      - pattern: "*token*"
      - pattern: "*secret*"
      - pattern: "*password*"
      - pattern: "*nonce*"
      - pattern: "*_key*"
      - pattern: Key::from_slice
      - pattern: Nonce::from_slice
      - pattern: Aes256Gcm::new
      - pattern: ChaCha20Poly1305::new
      - pattern: Hmac::new_from_slice
      - pattern: SigningKey::from_bytes
      - pattern: SecretKey::from_slice
      - pattern: jsonwebtoken::encode
      - pattern: EncodingKey::from_secret
