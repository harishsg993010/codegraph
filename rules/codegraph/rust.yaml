      - pattern: render_str
      - pattern: Handlebars::render_template
      - pattern: render_template
      - pattern: Handlebars::register_template_string
      - pattern: register_template_string
      - pattern: Environment::add_template
      - pattern: Environment::render_str
      - pattern: Environment::template_from_str
      - pattern: template_from_str
