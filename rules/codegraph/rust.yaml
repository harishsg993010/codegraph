      - pattern: body
      - pattern: stdin
    pattern-sinks:
      - pattern: serde_yaml::from_str
      - pattern: serde_yaml::from_slice
      - pattern: serde_yaml::from_reader
      - pattern: serde_pickle::from_slice
      - pattern: serde_pickle::from_reader
      - pattern: bincode::deserialize
      - pattern: bincode::deserialize_from
      - pattern: rmp_serde::from_slice
      - pattern: rmp_serde::from_read
      - pattern: ron::from_str
      - pattern: toml::from_str
      - pattern: Archive::new
      - pattern: ZipArchive::new
      - pattern: GzDecoder::new
      - pattern: XzDecoder::new
      - pattern: BzDecoder::new
