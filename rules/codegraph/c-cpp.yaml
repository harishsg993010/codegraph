# codegraph rules — C and C++. Apache-2.0.
#
# Untrusted input in C arrives through argv, environment, stdin, sockets
# and files; the sinks are the libc calls that trust their arguments. The
# flow through `strcpy(buf, x)` is followed by summary (the first argument
# is written from the second).

rules:
  - id: c.command-injection
    message: External input reaches a shell or exec
    severity: ERROR
    languages: [c, cpp]
    metadata: { cwe: CWE-78, owasp: "A03:2021" }
    pattern-sources:
      - pattern: argv
      - pattern: getenv
      - pattern: secure_getenv
      - pattern: fgets
      - pattern: gets
      - pattern: getline
      - pattern: scanf
      - pattern: fscanf
      - pattern: read
      - pattern: recv
      - pattern: recvfrom
      - pattern: recvmsg
      - pattern: readline
      - pattern: getchar
      - pattern: fread
      - pattern: request
      - pattern: req
      - pattern: "*request*"
    pattern-sinks:
      - pattern: system
      - pattern: popen
      - pattern: _popen
      - pattern: execl
      - pattern: execle
      - pattern: execlp
      - pattern: execv
      - pattern: execve
      - pattern: execvp
      - pattern: execvpe
      - pattern: posix_spawn
      - pattern: posix_spawnp
      - pattern: ShellExecute
      - pattern: ShellExecuteA
      - pattern: ShellExecuteW
      - pattern: ShellExecuteEx
      - pattern: CreateProcess
      - pattern: CreateProcessA
      - pattern: CreateProcessW
      - pattern: WinExec
      - pattern: _spawnl
      - pattern: _spawnv
      - pattern: _execl
      - pattern: _execv
      - pattern: QProcess.start
      - pattern: QProcess.execute
      - pattern: boost::process::system
      - pattern: boost::process::child

  - id: c.format-string
    message: External input reaches a format string
    severity: ERROR
    languages: [c, cpp]
    metadata: { cwe: CWE-134, owasp: "A03:2021" }
    pattern-sources:
      - pattern: argv
      - pattern: getenv
      - pattern: fgets
      - pattern: gets
      - pattern: getline
      - pattern: read
      - pattern: recv
      - pattern: recvfrom
      - pattern: fread
      - pattern: request
      - pattern: req
      - pattern: "*request*"
    pattern-sinks:
      - pattern: printf
      - pattern: fprintf
      - pattern: sprintf
      - pattern: snprintf
      - pattern: vprintf
      - pattern: vfprintf
      - pattern: vsprintf
      - pattern: vsnprintf
      - pattern: dprintf
      - pattern: syslog
      - pattern: vsyslog
      - pattern: err
      - pattern: errx
      - pattern: warn
      - pattern: warnx
      - pattern: wprintf
      - pattern: fwprintf
      - pattern: swprintf
      - pattern: asprintf
      - pattern: vasprintf

  - id: c.buffer-overflow
    message: External input reaches an unbounded copy or concatenation
    severity: ERROR
    languages: [c, cpp]
    metadata: { cwe: CWE-120, owasp: "A03:2021" }
    pattern-sources:
      - pattern: argv
      - pattern: getenv
      - pattern: fgets
      - pattern: gets
      - pattern: getline
      - pattern: read
      - pattern: recv
      - pattern: recvfrom
      - pattern: fread
      - pattern: request
      - pattern: req
      - pattern: "*request*"
    pattern-sinks:
      - pattern: strcpy
      - pattern: strcat
      - pattern: sprintf
      - pattern: vsprintf
      - pattern: gets
      - pattern: wcscpy
      - pattern: wcscat
      - pattern: lstrcpy
      - pattern: lstrcat
      - pattern: memcpy
      - pattern: memmove
      - pattern: strncpy
      - pattern: strncat
      - pattern: alloca
      - pattern: scanf
      - pattern: sscanf
    pattern-sanitizers:
      - pattern: strnlen
      - pattern: strlcpy
      - pattern: strlcat
      - pattern: snprintf
      - pattern: strncpy_s
      - pattern: strcpy_s
      - pattern: memcpy_s

  - id: c.path-traversal
    message: External input reaches a file open or path operation
    severity: WARNING
    languages: [c, cpp]
    metadata: { cwe: CWE-22, owasp: "A01:2021" }
    pattern-sources:
      - pattern: argv
      - pattern: getenv
      - pattern: fgets
      - pattern: read
      - pattern: recv
      - pattern: recvfrom
      - pattern: request
      - pattern: req
      - pattern: "*request*"
    pattern-sinks:
      - pattern: fopen
      - pattern: fopen64
      - pattern: freopen
      - pattern: open
      - pattern: open64
      - pattern: openat
      - pattern: creat
      - pattern: unlink
      - pattern: unlinkat
      - pattern: remove
      - pattern: rename
      - pattern: mkdir
      - pattern: rmdir
      - pattern: chmod
      - pattern: chown
      - pattern: stat
      - pattern: lstat
      - pattern: access
      - pattern: opendir
      - pattern: readlink
      - pattern: symlink
      - pattern: link
      - pattern: truncate
      - pattern: dlopen
      - pattern: LoadLibrary
      - pattern: LoadLibraryA
      - pattern: LoadLibraryW
      - pattern: CreateFile
      - pattern: CreateFileA
      - pattern: CreateFileW
      - pattern: DeleteFile
      - pattern: DeleteFileA
      - pattern: DeleteFileW
      - pattern: std::ifstream
      - pattern: std::ofstream
      - pattern: std::fstream
      - pattern: ifstream
      - pattern: ofstream
      - pattern: fstream
      - pattern: std::filesystem::remove
      - pattern: std::filesystem::remove_all
      - pattern: std::filesystem::rename
      - pattern: std::filesystem::copy
      - pattern: filesystem::path
      - pattern: QFile
      - pattern: QFile.open
      - pattern: QDir.remove
    pattern-sanitizers:
      - pattern: realpath
      - pattern: basename
      - pattern: canonicalize_file_name
      - pattern: std::filesystem::canonical
      - pattern: std::filesystem::weakly_canonical
      - pattern: filesystem::canonical
      - pattern: PathCanonicalize
      - pattern: GetFullPathName
      - pattern: "*sanitize*"

