      - pattern: sqlite3_prepare
      - pattern: sqlite3_prepare_v2
      - pattern: sqlite3_prepare_v3
      - pattern: sqlite3_get_table
      - pattern: mysql_query
      - pattern: mysql_real_query
      - pattern: mysql_stmt_prepare
      - pattern: PQexec
      - pattern: PQexecParams
      - pattern: PQprepare
      - pattern: PQsendQuery
      - pattern: SQLExecDirect
      - pattern: SQLExecDirectA
      - pattern: SQLExecDirectW
      - pattern: SQLPrepare
      - pattern: OCIStmtPrepare
      - pattern: OCIStmtPrepare2
      - pattern: QSqlQuery.exec
      - pattern: QSqlQuery.prepare
      - pattern: soci::session.prepare
    pattern-sanitizers:
      - pattern: mysql_real_escape_string
      - pattern: mysql_real_escape_string_quote
      - pattern: PQescapeStringConn
      - pattern: PQescapeString
      - pattern: PQescapeLiteral
      - pattern: PQescapeIdentifier
      - pattern: sqlite3_mprintf
      - pattern: sqlite3_snprintf
      - pattern: sqlite3_bind_text
      - pattern: sqlite3_bind_int
      - pattern: strtol
      - pattern: strtoul
      - pattern: atoi

  - id: c.code-loading-from-input
    message: External input names a library or symbol to load
    severity: WARNING
    languages: [c, cpp]
    metadata: { cwe: CWE-114, owasp: "A08:2021" }
    pattern-sources:
      - pattern: argv
      - pattern: getenv
      - pattern: fgets
      - pattern: read
      - pattern: recv
      - pattern: request
      - pattern: req
    pattern-sinks:
      - pattern: dlopen
      - pattern: dlsym
      - pattern: LoadLibrary
      - pattern: LoadLibraryA
      - pattern: LoadLibraryW
      - pattern: LoadLibraryEx
      - pattern: LoadLibraryExA
      - pattern: LoadLibraryExW
      - pattern: GetProcAddress
      - pattern: QLibrary.load
      - pattern: QLibrary.resolve

  - id: c.memory-size-from-input
    message: External input sizes an allocation or a copy
    severity: WARNING
    languages: [c, cpp]
    metadata: { cwe: CWE-789, owasp: "A03:2021" }
    pattern-sources:
      - pattern: argv
      - pattern: getenv
      - pattern: fgets
      - pattern: read
      - pattern: recv
      - pattern: recvfrom
      - pattern: fread
      - pattern: request
      - pattern: req
      - pattern: "*request*"
    pattern-sinks:
      - pattern: malloc
      - pattern: calloc
      - pattern: realloc
      - pattern: alloca
      - pattern: memcpy
      - pattern: memset
      - pattern: memmove
      - pattern: VirtualAlloc
      - pattern: HeapAlloc
      - pattern: new
      - pattern: reserve
      - pattern: resize

  - id: c.weak-random-for-secrets
    message: rand() reaches a key, token or nonce
    severity: WARNING
    languages: [c, cpp]
    metadata: { cwe: CWE-338, owasp: "A02:2021" }
    pattern-sources:
      - pattern: rand
      - pattern: rand_r
      - pattern: random
      - pattern: drand48
      - pattern: lrand48
      - pattern: srand
      - pattern: std::rand
      - pattern: std::mt19937
      - pattern: mt19937
      - pattern: std::default_random_engine
      - pattern: default_random_engine
      - pattern: std::minstd_rand
    pattern-sinks:
      - pattern: "*key*"
      - pattern: "*token*"
      - pattern: "*secret*"
      - pattern: "*nonce*"
      - pattern: "*iv*"
      - pattern: "*salt*"
      - pattern: EVP_EncryptInit
      - pattern: EVP_EncryptInit_ex
      - pattern: EVP_CipherInit_ex
      - pattern: AES_set_encrypt_key
      - pattern: HMAC
      - pattern: HMAC_Init_ex
      - pattern: RSA_generate_key_ex
      - pattern: EVP_PKEY_keygen
