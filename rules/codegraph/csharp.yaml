# codegraph rules — C#. Apache-2.0.
#
# ASP.NET handlers receive bound arguments and `Request`; the parameter
# names below are the conventions, the BCL and framework calls the sinks.

rules:
  - id: csharp.command-injection
    message: Request data reaches Process.Start
    severity: ERROR
    languages: [csharp]
    metadata: { cwe: CWE-78, owasp: "A03:2021" }
    pattern-sources:
      - pattern: request
      - pattern: req
      - pattern: Request
      - pattern: "*Request"
      - pattern: "*request*"
      - pattern: args
      - pattern: Environment.GetEnvironmentVariable
      - pattern: Environment.GetCommandLineArgs
      - pattern: Console.ReadLine
    pattern-sinks:
      - pattern: Process.Start
      - pattern: ProcessStartInfo
      - pattern: ProcessStartInfo.FileName
      - pattern: ProcessStartInfo.Arguments
      - pattern: Process.Start
    pattern-sanitizers:
      - pattern: "*Escape*"
      - pattern: "*Sanitize*"

  - id: csharp.sql-injection
    message: Request data reaches a SQL command built from it
    severity: ERROR
    languages: [csharp]
    metadata: { cwe: CWE-89, owasp: "A03:2021" }
    pattern-sources:
      - pattern: request
      - pattern: req
      - pattern: Request
      - pattern: "*Request"
      - pattern: "*request*"
    pattern-sinks:
      - pattern: SqlCommand
      - pattern: SqlCommand.CommandText
      - pattern: CommandText
      - pattern: OleDbCommand
      - pattern: OdbcCommand
      - pattern: OracleCommand
      - pattern: MySqlCommand
      - pattern: NpgsqlCommand
      - pattern: SqliteCommand
      - pattern: ExecuteReader
      - pattern: ExecuteNonQuery
      - pattern: ExecuteScalar
      - pattern: ExecuteReaderAsync
      - pattern: ExecuteNonQueryAsync
      - pattern: ExecuteScalarAsync
      - pattern: SqlDataAdapter
      - pattern: FromSqlRaw
      - pattern: ExecuteSqlRaw
      - pattern: ExecuteSqlRawAsync
      - pattern: SqlQuery
      - pattern: ExecuteSqlCommand
      - pattern: Database.SqlQuery
      - pattern: Database.ExecuteSqlCommand
      - pattern: Query                # Dapper
      - pattern: QueryAsync
      - pattern: Execute
      - pattern: ExecuteAsync
      - pattern: QueryFirst
      - pattern: QuerySingle
      - pattern: CreateSQLQuery
      - pattern: CreateQuery
    pattern-sanitizers:
      - pattern: FromSqlInterpolated
      - pattern: ExecuteSqlInterpolated
      - pattern: SqlParameter
      - pattern: Parameters.Add
      - pattern: Parameters.AddWithValue
      - pattern: int.Parse
      - pattern: int.TryParse
      - pattern: Convert.ToInt32

  - id: csharp.path-traversal
    message: Request data reaches a file operation
    severity: WARNING
    languages: [csharp]
    metadata: { cwe: CWE-22, owasp: "A01:2021" }
    pattern-sources:
      - pattern: request
      - pattern: req
      - pattern: Request
      - pattern: "*Request"
      - pattern: "*request*"
      - pattern: IFormFile.FileName
      - pattern: FileName
    pattern-sinks:
      - pattern: File.Open
      - pattern: File.OpenRead
      - pattern: File.OpenWrite
      - pattern: File.OpenText
      - pattern: File.Create
      - pattern: File.ReadAllText
      - pattern: File.ReadAllBytes
      - pattern: File.ReadAllLines
      - pattern: File.ReadLines
      - pattern: File.WriteAllText
      - pattern: File.WriteAllBytes
      - pattern: File.WriteAllLines
      - pattern: File.AppendAllText
      - pattern: File.Delete
      - pattern: File.Copy
      - pattern: File.Move
      - pattern: File.Exists
      - pattern: FileStream
      - pattern: StreamReader
      - pattern: StreamWriter
      - pattern: FileInfo
      - pattern: Directory.GetFiles
      - pattern: Directory.EnumerateFiles
      - pattern: Directory.CreateDirectory
      - pattern: Directory.Delete
      - pattern: Directory.Exists
      - pattern: DirectoryInfo
      - pattern: Path.Combine
      - pattern: PhysicalFile
      - pattern: File                 # Controller.File
      - pattern: FileStreamResult
      - pattern: PhysicalFileResult
      - pattern: ZipFile.ExtractToDirectory
      - pattern: ZipArchiveEntry.ExtractToFile
      - pattern: ExtractToFile
      - pattern: CopyTo
      - pattern: CopyToAsync
    pattern-sanitizers:
      - pattern: Path.GetFileName
      - pattern: Path.GetFullPath
      - pattern: Path.GetFileNameWithoutExtension
      - pattern: "*Sanitize*"

