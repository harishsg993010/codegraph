# codegraph rules — Java. Apache-2.0.
#
# Servlet and Spring handlers receive the request as a parameter
# (`request`, `req`, `httpRequest`) or as bound arguments; the parameter is
# the source, the JDK and framework calls the sinks.

rules:
  - id: java.command-injection
    message: Request data reaches Runtime.exec or ProcessBuilder
    severity: ERROR
    languages: [java]
    metadata: { cwe: CWE-78, owasp: "A03:2021" }
    pattern-sources:
      - pattern: request
      - pattern: req
      - pattern: "*Request"
      - pattern: "*request*"
      - pattern: args
      - pattern: System.getenv
      - pattern: System.getProperty
    pattern-sinks:
      - pattern: Runtime.exec
      - pattern: exec
      - pattern: ProcessBuilder
      - pattern: ProcessBuilder.command
      - pattern: command
      - pattern: ProcessBuilder.start
      - pattern: Executor.execute        # commons-exec
      - pattern: DefaultExecutor.execute
      - pattern: CommandLine.parse
    pattern-sanitizers:
      - pattern: "*escape*"
      - pattern: "*sanitize*"

  - id: java.sql-injection
    message: Request data reaches a SQL statement built from it
    severity: ERROR
    languages: [java]
    metadata: { cwe: CWE-89, owasp: "A03:2021" }
    pattern-sources:
      - pattern: request
      - pattern: req
      - pattern: "*Request"
      - pattern: "*request*"
    pattern-sinks:
      - pattern: Statement.execute
      - pattern: Statement.executeQuery
      - pattern: Statement.executeUpdate
      - pattern: Statement.executeLargeUpdate
      - pattern: Statement.addBatch
      - pattern: executeQuery
      - pattern: executeUpdate
      - pattern: Connection.prepareStatement
      - pattern: prepareStatement
      - pattern: Connection.prepareCall
      - pattern: prepareCall
      - pattern: Connection.nativeSQL
      - pattern: JdbcTemplate.query
      - pattern: JdbcTemplate.queryForObject
      - pattern: JdbcTemplate.queryForList
      - pattern: JdbcTemplate.queryForMap
      - pattern: JdbcTemplate.update
      - pattern: JdbcTemplate.execute
      - pattern: JdbcTemplate.batchUpdate
      - pattern: EntityManager.createQuery
      - pattern: EntityManager.createNativeQuery
      - pattern: createQuery
      - pattern: createNativeQuery
      - pattern: createSQLQuery
      - pattern: Session.createQuery
      - pattern: Session.createNativeQuery
      - pattern: Session.createSQLQuery
      - pattern: SqlSession.selectList
      - pattern: SqlSession.selectOne
    pattern-sanitizers:
      - pattern: ESAPI.encoder
      - pattern: encodeForSQL
      - pattern: "*escapeSql*"
      - pattern: Integer.parseInt
      - pattern: Long.parseLong

  - id: java.path-traversal
    message: Request data reaches a file open or path
    severity: WARNING
    languages: [java]
    metadata: { cwe: CWE-22, owasp: "A01:2021" }
    pattern-sources:
      - pattern: request
      - pattern: req
      - pattern: "*Request"
      - pattern: "*request*"
      - pattern: MultipartFile.getOriginalFilename
      - pattern: getOriginalFilename
      - pattern: Part.getSubmittedFileName
    pattern-sinks:
      - pattern: File
      - pattern: FileInputStream
      - pattern: FileOutputStream
      - pattern: FileReader
      - pattern: FileWriter
      - pattern: RandomAccessFile
      - pattern: Paths.get
      - pattern: Path.of
      - pattern: Files.readAllBytes
      - pattern: Files.readAllLines
      - pattern: Files.readString
      - pattern: Files.write
      - pattern: Files.writeString
      - pattern: Files.newInputStream
      - pattern: Files.newOutputStream
      - pattern: Files.newBufferedReader
      - pattern: Files.newBufferedWriter
      - pattern: Files.delete
      - pattern: Files.deleteIfExists
      - pattern: Files.copy
      - pattern: Files.move
      - pattern: Files.createDirectories
      - pattern: Files.list
      - pattern: Files.walk
      - pattern: FileUtils.readFileToString
      - pattern: FileUtils.writeStringToFile
      - pattern: FileUtils.openInputStream
      - pattern: FileUtils.copyFile
      - pattern: FileUtils.deleteDirectory
      - pattern: ServletContext.getResourceAsStream
      - pattern: ClassLoader.getResource
      - pattern: ClassLoader.getResourceAsStream
      - pattern: ZipFile
      - pattern: ZipInputStream
      - pattern: MultipartFile.transferTo
      - pattern: transferTo
    pattern-sanitizers:
      - pattern: FilenameUtils.getName
      - pattern: FilenameUtils.normalize
      - pattern: getName
      - pattern: Path.normalize
      - pattern: normalize
      - pattern: getCanonicalPath
      - pattern: getCanonicalFile
      - pattern: toRealPath
      - pattern: "*sanitize*"

