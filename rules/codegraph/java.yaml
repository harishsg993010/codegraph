      - pattern: PrintWriter.println
      - pattern: PrintWriter.write
      - pattern: PrintWriter.printf
      - pattern: PrintWriter.format
      - pattern: ServletOutputStream.print
      - pattern: ServletOutputStream.println
      - pattern: ServletOutputStream.write
      - pattern: JspWriter.print
      - pattern: JspWriter.println
      - pattern: JspWriter.write
      - pattern: getWriter
      - pattern: getOutputStream
    pattern-sanitizers:
      - pattern: ESAPI.encoder
      - pattern: encodeForHTML
      - pattern: encodeForHTMLAttribute
      - pattern: encodeForJavaScript
      - pattern: encodeForURL
      - pattern: StringEscapeUtils.escapeHtml4
      - pattern: StringEscapeUtils.escapeHtml
      - pattern: escapeHtml4
      - pattern: escapeHtml
      - pattern: escapeEcmaScript
      - pattern: HtmlUtils.htmlEscape
      - pattern: htmlEscape
