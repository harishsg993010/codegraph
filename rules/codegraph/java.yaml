      - pattern: "*Secret*"
      - pattern: "*Password*"
      - pattern: "*Nonce*"
      - pattern: SecretKeySpec
      - pattern: IvParameterSpec
      - pattern: KeyGenerator.init
      - pattern: Cipher.init
      - pattern: Mac.init
