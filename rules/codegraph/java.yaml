      - pattern: ObjectInputStream.readObject
      - pattern: readObject
      - pattern: readUnshared
      - pattern: XMLDecoder
      - pattern: XMLDecoder.readObject
      - pattern: XStream.fromXML
      - pattern: fromXML
      - pattern: Yaml.load
      - pattern: Yaml.loadAs
      - pattern: Yaml.loadAll
      - pattern: ObjectMapper.enableDefaultTyping
      - pattern: enableDefaultTyping
      - pattern: SerializationUtils.deserialize
      - pattern: Kryo.readObject
      - pattern: Kryo.readClassAndObject
      - pattern: Hessian2Input.readObject
      - pattern: JSON.parseObject
      - pattern: JSON.parse
    pattern-sanitizers:
