      - pattern: HttpClient.send
      - pattern: HttpClient.sendAsync
      - pattern: HttpRequest.newBuilder
      - pattern: HttpGet
      - pattern: HttpPost
      - pattern: HttpPut
      - pattern: HttpDelete
      - pattern: HttpUriRequest
      - pattern: RestTemplate.getForObject
      - pattern: RestTemplate.getForEntity
      - pattern: RestTemplate.postForObject
      - pattern: RestTemplate.postForEntity
      - pattern: RestTemplate.exchange
      - pattern: RestTemplate.execute
      - pattern: WebClient.create
      - pattern: WebClient.get
